id: fabric-fraud-intelligence
name: fabric-fraud-intelligence
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - https://fleet-north-8c279cc767-swedencentral.webapp.fabricapps.net
      - https://tangy-cove-9493188f6d-centralus.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  storage:
    enabled: false
  # Native Rayfin functions = Azure Functions (local port 7071). Preferred host for ../../backend
  # (shares Fabric SSO/OBO). Kept disabled until the Rayfin functions folder convention is documented
  # in the installed guide; until then the backend deploys as the standalone Azure Function (Terraform).
  functions:
    enabled: false
