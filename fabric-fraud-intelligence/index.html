<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fraud Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Application Insights (browser). Loads only when a connection string is injected at build
      // time (VITE_APPINSIGHTS_CONNECTION_STRING → produced by the azurerm_application_insights
      // resource). When absent the guard no-ops and diag stays console-only (offline/demo safe).
      // Once loaded it exposes window.appInsights, which src/backend/diag.ts forwards traces to.
      (function () {
        var cs = '%VITE_APPINSIGHTS_CONNECTION_STRING%';
        if (!cs || cs.indexOf('InstrumentationKey=') !== 0) return;
        var s = document.createElement('script');
        s.src = 'https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js';
        s.crossOrigin = 'anonymous';
        s.onload = function () {
          try {
            var AI = window.Microsoft && window.Microsoft.ApplicationInsights;
            if (!AI) return;
            var inst = new AI.ApplicationInsights({
              config: { connectionString: cs, enableAutoRouteTracking: true },
            });
            inst.loadAppInsights();
            inst.trackPageView();
            window.appInsights = inst;
          } catch (e) {
            /* never break the app on telemetry init */
          }
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('ffi.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
