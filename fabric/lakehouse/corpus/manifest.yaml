# Fraud document corpus manifest.
# Validated against corpus.schema.json. AML is the single RAFT training domain; every
# other domain is present only as a distractor (see raft.instructions.md). Near-duplicate,
# easily-confused documents are intentional — do not deduplicate.
version: 1
corpus_id: fraud-doc-corpus
training_domain: aml
documents:
  # --- AML (training domain) ---
  - id: aml-structuring
    title: "Structuring: threshold avoidance by a single actor"
    path: aml/structuring.md
    domain: aml
    typology: structuring
    role: training
    language: en
    confusable_with: [aml-smurfing, aml-layering]
  - id: aml-smurfing
    title: "Smurfing: sub-threshold amounts across many actors"
